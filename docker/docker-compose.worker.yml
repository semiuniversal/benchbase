# Creative execution worker (vNext WP7) — stub compose.
# Isolated from main benchbase API; no docker.sock mount (ADR-005, ADR-006).
#
# Usage: docker compose -f docker/docker-compose.worker.yml up --build
# OpenCode pin: set BENCHBASE_OPENCODE_LIVE=1 on worker after owner short test.
# Network: internal only; gateway URL injected at runtime (no docker.sock).

services:
  benchbase-worker:
    image: benchbase:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["sleep", "infinity"]
    environment:
      BENCHBASE_DATA_DIR: /app/data
      BENCHBASE_OPENCODE_LIVE: ${BENCHBASE_OPENCODE_LIVE:-0}
      OPENCODE_VERSION: "1.0.80"
    volumes:
      - ${BENCHBASE_HOST_DATA:-./data}:/app/data:rw
      - creative_workspaces:/workspaces
    networks:
      - creative_internal
    read_only: true
    tmpfs:
      - /tmp:size=512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

networks:
  creative_internal:
    internal: true

volumes:
  creative_workspaces: